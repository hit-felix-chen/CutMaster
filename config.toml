# Stage 0a: text-only LLM service
# model: OpenAI-compatible 文本模型名称。
# base_url: 模型服务的 OpenAI-compatible API 地址。
# api_key_env: 保存 API Key 的环境变量名；Application 配置不接受内联 api_key。
# enable_thinking: 是否为该服务的模型调用开启 thinking。
# temperature: 生成采样温度，越低结果越稳定。
# max_tokens: 单次响应允许生成的最大 token 数。
# timeout_sec: 单次模型请求的超时时间（秒）。
# max_retries: 首次请求失败后的完整重试次数。
# max_concurrency: LLM 请求的最大并发数，供台词、编排、检索和复核阶段共用。
# *_price_yuan_per_million_tokens: 未缓存输入、缓存命中输入、输出的计费单价，单位均为元/百万 token；请在供应商调价或账号折扣变化后同步更新。
[llm]
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
input_price_yuan_per_million_tokens = 1.0
cached_input_price_yuan_per_million_tokens = 0.02
output_price_yuan_per_million_tokens = 2.0

# 省事方案：让 LLM 也走 DashScope。启用时注释上面的 DeepSeek
# model = "qwen3.7-max"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# api_key_env = "DASHSCOPE_API_KEY"
# input_price_yuan_per_million_tokens = 6.0
# cached_input_price_yuan_per_million_tokens = 1.2
# output_price_yuan_per_million_tokens = 18.0

enable_thinking = true
temperature = 0.1
max_tokens = 40000
timeout_sec = 600.0
max_retries = 3
max_concurrency = 10

# Stage 0b: vision-language model service
# 字段含义与 [llm] 相同，但配置完全独立。
# model/base_url/api_key_env: 视觉语言模型及其服务和密钥来源。
# enable_thinking/temperature/max_tokens: 控制视觉请求的推理与输出。
# timeout_sec/max_retries: 控制单次视觉请求及其失败重试。
# max_concurrency: VLM 最大并发数，Segment 批量 Shot 标注、候选核验和片段对评分共用。
# 当前 qwen3.7-plus 单价采用中国内地、单次输入不超过 256K 的目录价；高阶梯或限时折扣需按实际账单手动调整。
[vlm]
model = "qwen3.7-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
input_price_yuan_per_million_tokens = 2.0
cached_input_price_yuan_per_million_tokens = 0.4
output_price_yuan_per_million_tokens = 8.0

enable_thinking = true
temperature = 0.1
max_tokens = 40000
timeout_sec = 600.0
max_retries = 3
max_concurrency = 10

# Stage 1: reusable video and music Material analysis
# material_library_dir: Material Library 根目录；保存清单、只读托管源文件和可复用分析结果。
[analyser.material_analysis]
material_library_dir = ".cutmaster/media"

# adaptive_threshold: PySceneDetect AdaptiveDetector 的自适应切镜阈值。
# adaptive_min_content_val: 判定切镜所需的最低内容变化值。
# adaptive_min_scene_len_sec: 允许生成的最短 Shot 时长（秒）。
# duplicate_frame_threshold: 去除近重复采样帧时使用的灰度平均绝对差阈值。
# 这组切镜参数也会被最终的源窗口优化阶段复用。
[analyser.shot_detection]
adaptive_threshold = 2.0
adaptive_min_content_val = 15.0
adaptive_min_scene_len_sec = 0.25
duplicate_frame_threshold = 1.0

# backend: ASR 服务后端，当前支持 bailian。
# api_key_env: 保存 ASR API Key 的环境变量名；Application 配置不接受内联 api_key。
# reuse: 是否复用已有的非空 source.srt 和 ASR 音频。
# timeout_sec: 一个异步 ASR 任务允许等待的总时长（秒）。
# poll_interval_sec: 查询异步 ASR 任务状态的间隔（秒）。
# max_chars: 初始字幕条目的期望最大字符数。
# max_subtitle_duration_sec: 初始字幕条目的期望最大持续时间（秒）。
[analyser.asr]
backend = "bailian"
api_key_env = "DASHSCOPE_API_KEY"
reuse = true
timeout_sec = 600.0
poll_interval_sec = 2.0
max_chars = 20
max_subtitle_duration_sec = 3.5

# Scene-VLM 语义 Scene 划分。
# context_shots: 单次 VLM 请求可见的连续 Shot 数，按论文固定为 20。
# focus_shots: 在上下文中央顺序判断边界的 Shot 数，按论文固定为 10。
# frames_per_shot: 每个 Shot 的均匀采样帧数，按论文固定为 3。
[analyser.scene_segmentation]
context_shots = 20
focus_shots = 10
frames_per_shot = 3

# shot_sample_frames: 每个 Shot 送给 VLM 标注的均匀采样帧数；当前固定要求为 5。
# max_images_per_request: VLM 单次请求允许的最大图片数。
# max_shots_per_request: 长 Segment 内单次 VLM 请求最多标注的 Shot 数；批次会逐个
# 保存 checkpoint，最后仍合并为一个 Segment。批量模式下每个 Shot 的 5 帧组成联系表。
[analyser.shot_annotation]
shot_sample_frames = 5
max_images_per_request = 250
max_shots_per_request = 20

# 完整音乐分析同样由 Analyser 负责，当前没有用户可调参数；librosa 会生成
# 能量、onset、beat、重音和音乐段落组成的可复用 Music Memory。

# Stage 2: music-aware edit-Slot arrangement
# target_clip_duration_sec: 画面 Slot 的目标时长（秒）；平均时长须接近该值，
# 单个 Slot 最长为该值的 1.5 倍。长原声通过 J/L-cut 跨 Slot，不会拉长画面 Slot。
# replan_max_rounds: 候选不足或严格时序路径无解时，最多重新编排 Slot 的轮数。
[planners.arrangement_architect]
target_clip_duration_sec = 4.0
replan_max_rounds = 3

# Stage 3: original-dialogue anchor selection
# max_anchors: 一条成片最多选择多少段原声；只保留最有剧情价值的少量台词。
# min_anchor_duration_sec: 每段原声的最短连续时长，过滤无意义的零碎短句。
[planners.dialogue_anchors]
max_anchors = 5
min_anchor_duration_sec = 3

# Stage 4a: structured candidate retrieval and visual validation
# candidates_per_slot: 每个非锚点 Slot 最终希望保留的候选片段数。
# retrieval_max_rounds: 重试次数。指定 Segment 先正常检索一次，再重试该次数；
# 随后在“指定 Segment＋前后各一个 Segment”范围内再检索该次数。
# Targeted Slot 重规划发生在检索轮次之间，不占用或增加候选检索轮次。
# visual_sample_frames: 每个候选片段送给 VLM 核验的均匀采样帧数。
# protagonist_visibility_likert_threshold: 必须出镜主体的最低 Likert 分数（1–5）。
# motion_sample_fps: 计算候选运动强度时的视频采样帧率。
# motion_workers: 并行解码与计算候选运动特征的 worker 数。
# static_kinetic_energy_threshold: 平均运动强度不高于该值时丢弃候选。
[planners.candidate_retrieval]
candidates_per_slot = 3
retrieval_max_rounds = 3
visual_sample_frames = 4
protagonist_visibility_likert_threshold = 3
motion_sample_fps = 2.0
motion_workers = 4
static_kinetic_energy_threshold = 0.05

# Stage 4b: chronological sequence selection
# beam_width: Beam Search 每一层保留的最高分路径数量；越大搜索更充分但占用更多计算。
[planners.beam_search]
beam_width = 8

# Stage 5: candidate-constrained script review
# review_rounds: 在既有候选池内让 LLM 复核并提出脚本替换的轮数。
[planners.script_review]
review_rounds = 1

# Stage 6: source-window optimization against visual cuts and music beats
# search_margin_sec: 围绕候选窗口搜索更合适视觉切点的时间范围（秒）。
# min_boundary_distance_sec: 内部切点距离片段首尾的首选安全距离（秒）。
# max_workers: 并行执行源窗口切点优化的最大 worker 数。
[planners.source_window_optimization]
search_margin_sec = 2.0
min_boundary_distance_sec = 1.0
max_workers = 8

# Stage 7: frame-exact rendering and BGM mixing
# width/height: 最终视频画布的像素尺寸。
# fps: 最终输出帧率，同时定义帧精确时间轴的网格。
# encoder: FFmpeg 视频编码器；auto 会选择当前环境可用的合适编码器。
# threads: 使用 libx264 时的编码线程数。
# bgm_volume: 最终背景音乐的音量倍率。
# original_volume: 普通原片音频音量；帧精确模式必须保持为 0。
# audio_sample_rate: 最终 AAC 音轨的采样率（Hz）。
[renderer]
width = 1920
height = 1080
fps = 30
encoder = "auto"
threads = 8
bgm_volume = 0.3
original_volume = 0.0
audio_sample_rate = 48000

# Stage 8b: original-dialogue preparation and mixing
# enable_vocal_separation: 是否用 Demucs 从最终选中的原声锚点中分离人声。
# separator_model: 使用的 Demucs 模型名称。
# separator_device: 分离设备；auto 按 CUDA、MPS、CPU 的顺序自动选择。
# separator_segment_sec: Demucs 内部分块长度（秒），调小可降低峰值内存。
# separator_shifts: 随机平移集成次数；增加可能改善质量，但会增加耗时。
# separator_padding_sec: 分离前在每段台词首尾增加的源音频上下文（秒）。
# separated_loudness_lufs: 分离后每段人声的目标响度。
# dialogue_volume: 最终混音中原声台词的音量倍率。
# bgm_duck_factor: 原声播放期间，背景音乐相对 bgm_volume 的衰减倍率。
# fade_sec: 每段原声台词首尾淡入淡出的持续时间（秒）。
[renderer.dialogue_audio]
enable_vocal_separation = true
separator_model = "htdemucs"
separator_device = "auto"
separator_segment_sec = 7
separator_shifts = 0
separator_padding_sec = 1.0
separated_loudness_lufs = -16.0
dialogue_volume = 1.0
bgm_duck_factor = 0.5
fade_sec = 0.3
