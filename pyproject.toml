[project]
name = "cutmaster"
version = "0.1.0"
description = "Multi-agent workflow and local workspace for long-video montage generation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "demucs>=4.1,<5",
    "fastapi>=0.115,<1",
    "librosa>=0.11,<1",
    "numpy>=1.26,<2",
    "jsonschema>=4.23,<5",
    "loguru>=0.7.3",
    "openai>=1.77.0",
    "opencv-python>=4.10,<5",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "requests>=2.32.0",
    "scenedetect==0.7.0",
    "torch>=2.13,<3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tqdm>=4.67.0",
    "uvicorn>=0.34,<1",
]

[project.scripts]
cutmaster = "cutmaster.adapters.cli.main:main"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "httpx>=0.28,<1",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutmaster"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
